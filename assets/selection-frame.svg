<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="Figma-style selection frame">
  <defs>
    <style>
      .soft { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <!-- quiet vault-like stage -->
  <rect width="560" height="220" fill="#fcfcfc"/>

  <!-- shape: soft abstract glyph (y-like path), drawn first -->
  <g transform="translate(168 48)">
    <path
      id="glyph"
      d="M 36 18 C 48 18 58 28 58 44 C 58 68 42 92 36 118
         M 36 18 C 24 18 14 28 14 44 C 14 68 30 92 36 118
         M 14 70 L 58 70
         M 36 118 C 36 132 28 148 12 158
         M 36 118 C 36 132 48 148 72 154"
      fill="none"
      stroke="#1b1b1b"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0"
    >
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.08;0.22" dur="2.8s" fill="freeze" repeatCount="indefinite"/>
    </path>

    <!-- selection bbox around glyph ~ 14,18 → 72,158 → pad to 8,12 78 164 -->
    <!-- animated open from top-left -->
    <g transform="translate(8 12)">
      <!-- border -->
      <rect
        x="0" y="0" width="70" height="152"
        fill="none"
        stroke="#0d99ff"
        stroke-width="1.25"
        pathLength="100"
        stroke-dasharray="100"
        stroke-dashoffset="100"
      >
        <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.12;0.38;0.82;1" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.2;0.85;1" dur="2.8s" repeatCount="indefinite"/>
      </rect>

      <!-- corner handles: TL TR BR BL -->
      <g>
        <!-- TL -->
        <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fff" stroke="#0d99ff" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.36;0.85;1" dur="2.8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1;1;0.4" keyTimes="0;0.28;0.4;0.85;1" dur="2.8s" repeatCount="indefinite" additive="sum"/>
        </rect>
        <!-- TR -->
        <rect x="66.5" y="-3.5" width="7" height="7" fill="#fff" stroke="#0d99ff" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.4;0.85;1" dur="2.8s" repeatCount="indefinite"/>
        </rect>
        <!-- BR -->
        <rect x="66.5" y="148.5" width="7" height="7" fill="#fff" stroke="#0d99ff" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.44;0.85;1" dur="2.8s" repeatCount="indefinite"/>
        </rect>
        <!-- BL -->
        <rect x="-3.5" y="148.5" width="7" height="7" fill="#fff" stroke="#0d99ff" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.48;0.85;1" dur="2.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- dimension badge -->
      <g opacity="0" transform="translate(35 172)">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.46;0.85;1" dur="2.8s" repeatCount="indefinite"/>
        <rect x="-28" y="0" width="56" height="18" rx="4" fill="#0d99ff"/>
        <text class="soft" x="0" y="12.5" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">70 × 152</text>
      </g>
    </g>

    <!-- bezier rig: a few anchors + arms that fade after box settles -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.82;1" dur="2.8s" repeatCount="indefinite"/>
      <!-- arm -->
      <line x1="36" y1="70" x2="58" y2="44" stroke="#9bb7d4" stroke-width="1"/>
      <line x1="36" y1="70" x2="14" y2="44" stroke="#9bb7d4" stroke-width="1"/>
      <!-- anchors -->
      <circle cx="36" cy="70" r="3.5" fill="#fff" stroke="#0d99ff" stroke-width="1.2"/>
      <circle cx="36" cy="18" r="3.5" fill="#fff" stroke="#0d99ff" stroke-width="1.2"/>
      <circle cx="36" cy="118" r="3.5" fill="#fff" stroke="#0d99ff" stroke-width="1.2"/>
      <!-- diamond handles -->
      <rect x="55.5" y="41.5" width="5" height="5" fill="#fff" stroke="#0d99ff" transform="rotate(45 58 44)"/>
      <rect x="11.5" y="41.5" width="5" height="5" fill="#fff" stroke="#0d99ff" transform="rotate(45 14 44)"/>
    </g>
  </g>

  <!-- right caption, vault-quiet -->
  <g class="soft" fill="#1b1b1b" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0.85" keyTimes="0;0.2;0.4;0.9;1" dur="2.8s" repeatCount="indefinite"/>
    <text x="300" y="88" font-size="15" font-weight="600">selection</text>
    <text x="300" y="112" font-size="13" fill="#6b6b6b">blue frame · corner handles · W×H</text>
    <text x="300" y="134" font-size="12" fill="#9a9a9a">like the Figma layer chrome</text>
  </g>
</svg>
